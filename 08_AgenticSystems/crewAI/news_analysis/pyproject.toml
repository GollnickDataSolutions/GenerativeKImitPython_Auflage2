[project]
name = "news_analysis"
version = "0.1.0"
description = "news-analysis using crewAI"
authors = [{ name = "Bert Gollnick", email = "info@gollnickdata.de" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.14,<2.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["agents", "crew.jsonc", "tools", "knowledge", "skills"]

[tool.crewai]
type = "crew"
definition = "crew.jsonc"
project_id = "6c1d34fc-f222-414f-b8f7-d19f6e83ae9f"
