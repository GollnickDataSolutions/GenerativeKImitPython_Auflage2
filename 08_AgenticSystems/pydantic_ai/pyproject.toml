[project]
name = "pydantic-ai-examples"
version = "0.1.0"
description = "Beispiele zu Pydantic AI (Kapitel 8)"
requires-python = ">=3.13,<3.14"
# eigene Umgebung, weil pydantic-ai das (in opentelemetry-api 1.44 entfernte)
# Modul opentelemetry._events benoetigt, das Hauptprojekt ueber
# agent-framework/mcp aber opentelemetry-api>=1.44 zieht
dependencies = [
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "logfire>=4.40.0",
    "nest-asyncio2>=1.7.2",
    # 2.x, weil die Skripte output_type/result.output verwenden
    "pydantic-ai>=2.27.0",
    "python-dotenv>=1.2.2",
    "wikipedia>=1.4.0",
]
